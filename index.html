<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio | Biru Modern</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f6fc;
            color: #1e2a41;
            line-height: 1.6;
            overflow-x: hidden;
        }

        :root {
            --biru-utama: #4a9fd8;
            --biru-terang: #7bc4e8;
            --biru-muda: #e1f0fa;
            --biru-gelap: #2b7cb1;
            --putih: #ffffff;
            --abu-biru: #d9e6f2;
            --bg-soft: #f0f6fc;
            --shadow-sm: 0 8px 20px rgba(0, 80, 150, 0.06);
            --shadow-md: 0 12px 28px rgba(0, 70, 140, 0.1);
            --radius-card: 24px;
            --radius-sm: 16px;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        /* ========== NAVBAR ========== */
        .navbar {
            background: transparent;
            padding: 1.2rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(12px);
            background: rgba(240, 246, 252, 0.85);
            border-bottom: 1px solid rgba(74, 159, 216, 0.1);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .nav-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #a0aec0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            border: none;
        }

        .nav-icon:hover { background: var(--biru-utama); }

        .nav-icon.add {
            background: var(--biru-utama);
            border-radius: 14px;
            width: 42px;
            height: 42px;
            font-size: 1.3rem;
        }

        .nav-icon.add:hover { background: var(--biru-gelap); }

        .nav-center {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-center a {
            text-decoration: none;
            color: #2d3748;
            font-weight: 600;
            font-size: 1rem;
            transition: 0.2s;
            padding-bottom: 4px;
            border-bottom: 3px solid transparent;
        }

        .nav-center a:hover { color: var(--biru-utama); }

        .nav-center a.active {
            color: var(--biru-utama);
            border-bottom-color: var(--biru-utama);
        }

        .nav-right {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .btn-nav {
            padding: 0.55rem 1.6rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-nav-outline {
            border-color: #2d3748;
            color: #2d3748;
            background: transparent;
        }

        .btn-nav-outline:hover { background: #e2e8f0; }

        .btn-nav-primary {
            background: var(--biru-utama);
            color: white;
            border-color: var(--biru-utama);
        }

        .btn-nav-primary:hover { background: var(--biru-gelap); }

        .menu-toggle {
            display: none;
            font-size: 1.8rem;
            background: none;
            border: none;
            color: #2d3748;
            cursor: pointer;
        }

        /* ========== HERO BANNER ========== */
        .hero-banner {
            background: linear-gradient(135deg, #8ed1e8 0%, #b6e3f0 100%);
            border-radius: 40px;
            margin: 1.5rem auto 2rem;
            padding: 2.5rem 3rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            min-height: 320px;
            box-shadow: var(--shadow-sm);
        }

        .hero-banner::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
        }

        .hero-banner::after {
            content: '';
            position: absolute;
            bottom: -80px;
            left: -80px;
            width: 250px;
            height: 250px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .hero-text {
            flex: 1 1 50%;
            z-index: 2;
        }

        .hero-text .tag {
            font-size: 1rem;
            font-weight: 700;
            color: #d53f8c;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        .hero-text h1 {
            font-size: 3.8rem;
            font-weight: 800;
            color: #1a365d;
            line-height: 1.1;
            margin-bottom: 1rem;
        }

        .hero-text p {
            font-size: 1rem;
            color: #2d3748;
            max-width: 460px;
            margin-bottom: 1.5rem;
            opacity: 0.85;
        }

        .hero-text .read-more {
            display: inline-block;
            color: #1a365d;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 6px;
            transition: 0.2s;
        }

        .hero-text .read-more:hover { color: #0a2a4a; }

        .hero-lines {
            display: flex;
            gap: 0.8rem;
            margin-top: 2rem;
        }

        .hero-lines span {
            width: 50px;
            height: 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.7);
        }

        .hero-lines span.active { background: white; width: 70px; }

        .hero-image {
            flex: 0 0 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            position: relative;
        }

        .hero-image .avatar-circle {
            width: 240px;
            height: 240px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8rem;
            color: #1a365d;
            border: 4px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        /* ========== MAIN GRID ========== */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 2rem;
            margin: 2.5rem 0 3rem;
        }

        /* ===== KIRI: ARTWORK / PORTOFOLIO ===== */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.2rem;
        }

        .section-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1a365d;
        }

        .section-header a {
            color: #4a9fd8;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .artwork-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.2rem;
        }

        .artwork-card {
            background: var(--putih);
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: 0.3s;
            cursor: pointer;
        }

        .artwork-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }

        .artwork-img {
            height: 140px;
            background: linear-gradient(135deg, #8ed1e8, #b6e3f0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
        }

        .artwork-card:nth-child(2) .artwork-img {
            background: linear-gradient(135deg, #7bc4e8, #4a9fd8);
        }

        .artwork-info {
            padding: 0.8rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .artwork-info span {
            font-size: 0.8rem;
            color: #718096;
            font-weight: 500;
        }

        .btn-view-more {
            display: block;
            width: 100%;
            padding: 0.9rem;
            background: transparent;
            border: 2px solid var(--biru-utama);
            border-radius: 50px;
            color: var(--biru-utama);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .btn-view-more:hover { background: var(--biru-muda); }

        /* ===== TENGAH: RECENT SEARCH ===== */
        .search-section {
            position: relative;
        }

        .search-items {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .search-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: var(--putih);
            padding: 0.8rem 1.2rem;
            border-radius: 50px;
            box-shadow: var(--shadow-sm);
            transition: 0.2s;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .search-item:hover { border-color: var(--biru-terang); }

        .search-item i {
            color: var(--biru-utama);
            font-size: 0.9rem;
            width: 18px;
            text-align: center;
        }

        .search-item span {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2d3748;
        }

        .search-item:nth-child(3) { background: #2d3748; color: white; }
        .search-item:nth-child(3) i { color: #7bc4e8; }
        .search-item:nth-child(3) span { color: white; }

        /* Floating avatars */
        .floating-avatar {
            position: absolute;
            width: 80px;
            height: 80px;
            background: #b6e3f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #1a365d;
            border: 3px solid white;
            box-shadow: var(--shadow-sm);
            z-index: 10;
        }

        .floating-avatar.one {
            top: -20px;
            right: -10px;
            width: 70px;
            height: 70px;
            font-size: 2rem;
            background: #fbb6ce;
            color: #9b2c6b;
        }

        .floating-avatar.two {
            bottom: -10px;
            right: -20px;
            width: 65px;
            height: 65px;
            font-size: 1.8rem;
            background: #7bc4e8;
            color: #1a365d;
        }

        .close-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 24px;
            height: 24px;
            background: #4a9fd8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.7rem;
            cursor: pointer;
            border: 2px solid white;
        }

        /* ===== KANAN: FEATURES / ABOUT ===== */
        .feature-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .feature-item {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            background: var(--putih);
            padding: 1.2rem 1.4rem;
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-sm);
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .feature-item:hover { border-color: var(--biru-terang); }

        .feature-number {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--biru-utama);
            line-height: 1;
            min-width: 45px;
            letter-spacing: -1px;
        }

        .feature-content h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #1a365d;
            margin-bottom: 0.25rem;
        }

        .feature-content p {
            font-size: 0.85rem;
            color: #718096;
            line-height: 1.4;
        }

        /* ========== ABOUT SECTION ========== */
        .about-section {
            background: var(--putih);
            border-radius: 40px;
            padding: 3rem;
            margin: 2rem 0;
            box-shadow: var(--shadow-sm);
        }

        .about-grid {
            display: flex;
            gap: 3rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .about-text { flex: 1 1 350px; }

        .about-text h2 {
            font-size: 2rem;
            font-weight: 800;
            color: #1a365d;
            margin-bottom: 1rem;
        }

        .about-text h2 span { color: var(--biru-utama); }

        .about-text p {
            color: #4a5568;
            margin-bottom: 1rem;
        }

        .skill-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 1.2rem;
        }

        .skill-item {
            background: var(--biru-muda);
            color: var(--biru-gelap);
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .about-stats {
            flex: 0 0 220px;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            background: #f6faff;
            padding: 2rem;
            border-radius: 32px;
        }

        .stat-item { text-align: center; }

        .stat-number {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--biru-utama);
        }

        .stat-label {
            font-size: 0.85rem;
            color: #718096;
            font-weight: 500;
        }

        /* ========== CONTACT ========== */
        .contact-section {
            background: linear-gradient(135deg, #8ed1e8 0%, #b6e3f0 100%);
            border-radius: 40px;
            padding: 3rem;
            margin: 2rem 0;
        }

        .contact-wrapper {
            display: flex;
            gap: 2.5rem;
            flex-wrap: wrap;
        }

        .contact-info {
            flex: 1 1 260px;
            color: #1a365d;
        }

        .contact-info h3 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.2rem;
        }

        .contact-item i {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a365d;
            font-size: 1rem;
        }

        .contact-item .detail {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .contact-item .detail span {
            display: block;
            font-weight: 400;
            font-size: 0.8rem;
            color: #2d3748;
        }

        .contact-form {
            flex: 2 1 380px;
            background: var(--putih);
            border-radius: var(--radius-card);
            padding: 2rem;
            box-shadow: var(--shadow-sm);
        }

        .contact-form h3 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1a365d;
            margin-bottom: 1.5rem;
        }

        .form-group { margin-bottom: 1.2rem; }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 2px solid var(--abu-biru);
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            background: #fbfdff;
            transition: 0.2s;
            color: #1e2a41;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--biru-utama);
            box-shadow: 0 0 0 4px rgba(74, 159, 216, 0.1);
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .btn-submit {
            width: 100%;
            border: none;
            background: var(--biru-utama);
            color: white;
            padding: 0.9rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .btn-submit:hover {
            background: var(--biru-gelap);
            transform: translateY(-2px);
        }

        /* ========== FOOTER ========== */
        footer {
            background: #1a365d;
            color: #b8cde0;
            padding: 2rem 0;
            border-radius: 40px 40px 0 0;
            margin-top: 2rem;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .footer-content p { font-size: 0.85rem; }

        .social-links { display: flex; gap: 1rem; }

        .social-links a {
            color: #b8cde0;
            font-size: 1.1rem;
            transition: 0.2s;
            background: rgba(255, 255, 255, 0.08);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .social-links a:hover {
            background: var(--biru-utama);
            color: white;
            transform: translateY(-3px);
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 992px) {
            .main-grid {
                grid-template-columns: 1fr 1fr;
                gap: 1.5rem;
            }
            .main-grid > *:last-child {
                grid-column: span 2;
            }
            .feature-list {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .feature-item {
                flex: 1 1 200px;
            }
            .hero-banner {
                flex-direction: column;
                text-align: center;
                padding: 2rem;
            }
            .hero-text .hero-lines { justify-content: center; }
